name: v17 - Build and Package
permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches: [main]

env:
  config: Release
  out_folder: ./build-out/

jobs:
  version:
    runs-on: windows-latest
    outputs:
      version_string: ${{ steps.gitversion.outputs.fullSemVer }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: "5.x"

      - name: Determine Version with GitVersion
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3
        with:
          useConfigFile: true
          configFilePath: ./GitVersion.yml

      - name: Display version
        run: |
          echo "Full Version: ${{ steps.gitversion.outputs.fullSemVer }}"

  build-project:
    runs-on: windows-latest
    needs: version

    env:
      solution_name: ./uSync.Automate.slnx
      test_project: ./uSync.Automate.Tests/uSync.Automate.Tests.csproj
      test_project_complete: ./uSync.Automate.Tests.Complete/uSync.Automate.Tests.Complete.csproj

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: restore
        run: dotnet restore ${{ env.solution_name }}

      - name: build
        run: dotnet build ${{ env.solution_name }} -c ${{ env.config }} -p:ContinuousIntegrationBuild=true

      - name: test
        run: dotnet test ${{ env.test_project }} -c ${{ env.config }}

      - name: test (Complete)
        run: dotnet test ${{ env.test_project_complete }} -c ${{ env.config }}

  package-up:
    runs-on: windows-latest
    needs: [build-project, version]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: version
        run: |
          echo "Version: ${{ needs.version.outputs.version_string }}"

      - name: npm install (uSync.Automate client)
        working-directory: ./uSync.Automate/automate-client
        run: npm ci

      - name: npm build (uSync.Automate client)
        working-directory: ./uSync.Automate/automate-client
        run: npm run build

      - name: restore
        run: dotnet restore ./uSync.Automate.slnx

      - name: package uSync.Automate
        run: dotnet pack ./uSync.Automate/uSync.Automate.csproj -c ${{ env.config }} --output ${{ env.out_folder }} /p:version=${{ needs.version.outputs.version_string }}

      - name: package uSync.Automate.Actions
        run: dotnet pack ./uSync.Automate.Actions/uSync.Automate.Actions.csproj -c ${{ env.config }} --output ${{ env.out_folder }} /p:version=${{ needs.version.outputs.version_string }}

      - name: package uSync.Automate.Actions.Complete
        run: dotnet pack ./uSync.Automate.Actions.Complete/uSync.Automate.Actions.Complete.csproj -c ${{ env.config }} --output ${{ env.out_folder }} /p:version=${{ needs.version.outputs.version_string }}

      - name: Upload nuget file as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nuget Build Output
          path: ${{ env.out_folder }}
