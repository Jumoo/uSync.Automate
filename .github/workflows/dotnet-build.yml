name: v17 - PR Project Build and Test
permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    branches: [main]

env:
  config: Release

jobs:
  build-project:
    runs-on: windows-latest

    env:
      solution_name: ./uSync.Automate.slnx
      test_project: ./uSync.Automate.Tests/uSync.Automate.Tests.csproj
      test_project_complete: ./uSync.Automate.Tests.Complete/uSync.Automate.Tests.Complete.csproj

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: restore
        run: dotnet restore ${{ env.solution_name }}

      - name: build
        run: dotnet build ${{ env.solution_name }} -c ${{ env.config }} -p:ContinuousIntegrationBuild=true

      - name: test
        run: dotnet test ${{ env.test_project }} -c ${{ env.config }}

      - name: test (Complete)
        run: dotnet test ${{ env.test_project_complete }} -c ${{ env.config }}
