name: Release to NuGet

# Publishing is triggered by pushing a version tag:
#
#   git tag v0.17.3 && git push origin v0.17.3
#
# NOTE: "branches" and "tags" under push: are OR'd, not AND'd - a tag filter cannot
# be restricted to a branch in the trigger itself. The tag has to be on a release
# branch (main, v17/main, ...), so that is enforced as a step below instead.

permissions:
  contents: read

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  config: Release
  out_folder: ./build-out/
  nuget_source: https://api.nuget.org/v3/index.json

jobs:
  release:
    runs-on: windows-latest

    permissions:
      contents: read
      # required for trusted publishing - this is what lets the job request the
      # short lived OIDC token that NuGet/login exchanges for a push key.
      id-token: write

    # This is load bearing: the trusted publishing policy on nuget.org names this
    # environment, and the token exchange is rejected if the job doesn't run in an
    # environment of exactly this name. Don't remove or rename it without updating
    # the policy to match.
    environment: nuget

    steps:
      - uses: actions/checkout@v4
        with:
          # full history, the branch containment check below needs it
          fetch-depth: 0

      - name: check the tag looks like a version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not v{major}.{minor}.{patch}[-suffix]"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version"

      - name: check the tag is on a release branch
        shell: bash
        run: |
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --quiet
          branches=$(git branch -r --contains "$GITHUB_SHA" --format='%(refname:short)')
          echo "Tagged commit is on:"
          echo "$branches" | sed 's/^/  /'
          if ! printf '%s\n' "$branches" | grep -qE '^origin/(v[0-9]+/)?main$'; then
            echo "::error::Tag $GITHUB_REF_NAME is not on main or v{major}/main - refusing to publish"
            exit 1
          fi

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: npm install (uSync.Automate client)
        working-directory: ./uSync.Automate/automate-client
        run: npm ci

      - name: npm build (uSync.Automate client)
        working-directory: ./uSync.Automate/automate-client
        run: npm run build

      - name: restore
        run: dotnet restore ./uSync.Automate.slnx

      # deliberately not --no-build: the version has to be stamped onto the assembly as
      # well as the nuspec, so these steps rebuild with it.
      - name: package uSync.Automate
        run: >
          dotnet pack ./uSync.Automate/uSync.Automate.csproj
          -c ${{ env.config }} --output ${{ env.out_folder }}
          /p:version=${{ steps.version.outputs.version }}
          -p:ContinuousIntegrationBuild=true

      - name: package uSync.Automate.Actions
        run: >
          dotnet pack ./uSync.Automate.Actions/uSync.Automate.Actions.csproj
          -c ${{ env.config }} --output ${{ env.out_folder }}
          /p:version=${{ steps.version.outputs.version }}
          -p:ContinuousIntegrationBuild=true

      - name: package uSync.Automate.Actions.Complete
        run: >
          dotnet pack ./uSync.Automate.Actions.Complete/uSync.Automate.Actions.Complete.csproj
          -c ${{ env.config }} --output ${{ env.out_folder }}
          /p:version=${{ steps.version.outputs.version }}
          -p:ContinuousIntegrationBuild=true

      # keep a copy regardless of what happens on the push
      - name: upload packages as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-release-${{ steps.version.outputs.version }}
          path: ${{ env.out_folder }}

      # Trusted publishing: exchanges this job's OIDC token for a short lived NuGet
      # key, so there is no long lived secret in the repo to leak or rotate. It only
      # works if a matching policy exists on nuget.org for this repo + workflow, and
      # "user" must be the nuget.org account that owns that policy.
      - name: nuget login
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER || 'Jumoo' }}

      # --skip-duplicate so re-running a tag is a no-op rather than a failure.
      #
      # Two Windows/pwsh quirks here:
      # - $env:NUGET_API_KEY, not $NUGET_API_KEY - this runner's default shell is
      #   pwsh, where a bare $NAME is an unset local variable, not the env var.
      # - the glob has to use a backslash before the filename (".\build-out\*.nupkg").
      #   With a forward slash - even without a leading "./" - `dotnet nuget push`
      #   doesn't treat it as a wildcard on Windows and fails with "File does not
      #   exist", despite the same pattern working fine with no subdirectory at all.
      - name: push to nuget
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: >
          dotnet nuget push ".\build-out\*.nupkg"
          --api-key "$env:NUGET_API_KEY"
          --source ${{ env.nuget_source }}
          --skip-duplicate
