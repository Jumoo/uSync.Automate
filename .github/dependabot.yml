version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    # Umbraco and uSync (including uSync.Complete's uSync.Publisher/uSync.Expansions.Core) are
    # pinned deliberately. The versions referenced here set the minimum for anyone installing
    # these packages, so they move when we choose to move them - not on a weekly schedule. Note
    # this also opts them out of dependabot security updates.
    ignore:
      - dependency-name: "Umbraco.*"
      - dependency-name: "uSync*"
    # majors are deliberately left out of the group so they arrive as one PR each.
    groups:
      nuget-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/uSync.Automate/automate-client"
    schedule:
      interval: "weekly"
    # TypeScript stays on v5 until hey-api (our generated API client) supports TS 7.
    # hey-api majors change the generated client, so they move when we choose.
    ignore:
      - dependency-name: "typescript"
        versions: [">=6"]
      - dependency-name: "@hey-api/*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # gittools/actions v4 requires GitVersion >= 6.2, which needs GitVersion.yml migrating
    # to the v6 schema. Dependabot can't see that the action version and the versionSpec
    # input are coupled, so bumping it alone broke the package-build workflow. Unpin this
    # when GitVersion.yml is migrated to v6 deliberately.
    ignore:
      - dependency-name: "gittools/actions"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
